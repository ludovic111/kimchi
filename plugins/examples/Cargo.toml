[package]
name = "kimchi-plugin-examples"
description = "Example kimchi video plugins built with the kimchi-plugin SDK: Halftone, Chromatic aberration (effects), Gradient (a generator) and Radial wipe (a transition)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# A cdylib to install like any plugin (a bundle with plugin.toml); an rlib so kimchi links the
# same plugins in as stock plugins, through the same ABI.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kimchi-plugin = { path = "../../crates/kimchi-plugin" }
