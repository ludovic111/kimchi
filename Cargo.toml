[workspace]
resolver = "3"
members = ["crates/*", "plugins/*"]

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ludovic111/kimchi"
# The highest any dependency asks for: oo7 0.6 (GPUI's Linux keyring, through gpui_linux) needs 1.92.
rust-version = "1.92"

[workspace.dependencies]
kimchi-core = { path = "crates/kimchi-core" }
kimchi-audio = { path = "crates/kimchi-audio" }
kimchi-media = { path = "crates/kimchi-media" }
kimchi-gen = { path = "crates/kimchi-gen" }
kimchi-control = { path = "crates/kimchi-control" }
kimchi-agent = { path = "crates/kimchi-agent" }
kimchi-cli = { path = "crates/kimchi-cli" }
kimchi-captions = { path = "crates/kimchi-captions" }
kimchi-interop = { path = "crates/kimchi-interop" }

anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
cosmic-text = "0.19"
dirs = "6"
flate2 = "1"
futures = "0.3"
minisign = "0.10"
minisign-verify = "0.2"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls", "gzip"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tiny-skia = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "process", "io-util", "net"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
wiremock = "0.6"

[profile.dev.package."*"]
opt-level = 2

# The mixer runs in real time behind the preview: even debug builds need it optimised.
[profile.dev.package.kimchi-audio]
opt-level = 2
