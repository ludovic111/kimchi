name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ (matrix.os == 'ubuntu-22.04' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && (vars.LINUX_RUNNER || 'ludodesktop') || matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # On ludodesktop, keep target/ between runs (incremental builds).
          clean: ${{ runner.environment == 'github-hosted' }}
      # GPUI's Linux backends (X11 + Wayland, Vulkan, fontconfig) and the keychain (D-Bus);
      # see script/linux in the zed repository. kimchi-media's tests use the static ffmpeg the app
      # ships (Ubuntu 22.04's own ffmpeg 4.4 is too old for them).
      - name: Linux dependencies
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libasound2-dev libdbus-1-dev libfontconfig-dev libfreetype-dev \
            libssl-dev libvulkan-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libzstd-dev libglib2.0-dev
      - name: Linux ffmpeg
        if: runner.os == 'Linux'
        run: |
          bash scripts/fetch-ffmpeg.sh x86_64-unknown-linux-gnu
          echo "KIMCHI_FFMPEG=$PWD/target/ffmpeg/x86_64-unknown-linux-gnu/kimchi-ffmpeg" >> "$GITHUB_ENV"
          echo "KIMCHI_FFPROBE=$PWD/target/ffmpeg/x86_64-unknown-linux-gnu/kimchi-ffprobe" >> "$GITHUB_ENV"
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Own Rust install per repo on ludodesktop
        # The runners of several repos run at once; a shared ~/.rustup makes their installs collide.
        if: runner.environment == 'self-hosted'
        run: |
          echo "RUSTUP_HOME=$HOME/.rustup-${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.cargo-${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Read access to the private ryolune engine
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.RYOLUNE_DEPLOY_KEY }}
      - name: Fetch ryolune over SSH
        shell: bash
        # Scoped to this job (not git config --global): on ludodesktop the runners of all repos share
        # one user, and a global rewrite would send ryolune's own checkout over SSH.
        run: |
          git config --global --unset-all url."ssh://git@github.com/ludovic111/ryolune".insteadOf || true
          echo "GIT_CONFIG_COUNT=1" >> "$GITHUB_ENV"
          echo "GIT_CONFIG_KEY_0=url.ssh://git@github.com/ludovic111/ryolune.insteadOf" >> "$GITHUB_ENV"
          echo "GIT_CONFIG_VALUE_0=https://github.com/ludovic111/ryolune" >> "$GITHUB_ENV"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            # GitHub's published SSH host keys (api.github.com/meta), so the fetch can verify github.com.
            # HostKeyAlias: the ssh-agent action reaches github.com through a per-key host alias.
            mkdir -p ~/.ssh
            curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts.github
            echo "GIT_SSH_COMMAND=ssh -o HostKeyAlias=github.com -o UserKnownHostsFile=$HOME/.ssh/known_hosts.github -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
          fi
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - name: Scripts parse
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
