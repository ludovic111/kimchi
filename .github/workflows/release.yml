name: Release

# Builds kimchi for macOS (Apple Silicon + Intel), Windows and Linux, signs the
# updater artifacts and attaches everything (plus latest.json for the in-app
# updater) to a draft GitHub release. Publish the draft to ship the update.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple Silicon), os: macos-latest, target: aarch64-apple-darwin }
          - { name: macOS (Intel), os: macos-latest, target: x86_64-apple-darwin }
          - { name: Windows, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: Linux, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libdbus-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Bundle ffmpeg
        run: node scripts/fetch-ffmpeg.mjs ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: kimchi v__VERSION__
          releaseBody: |
            Download the build for your system below. kimchi updates itself from here on.

            - **macOS**: `.dmg` (Apple Silicon: `aarch64`, Intel: `x64`). The app isn't notarized yet: the first time, right-click it → Open.
            - **Windows**: `.exe` (installer) or `.msi`.
            - **Linux**: `.AppImage`, `.deb` or `.rpm`.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
