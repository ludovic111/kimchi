name: Release

# Builds kimchi for Linux (macOS and Windows are coming soon: see the matrix) with the scripts in scripts/
# (no Node, no Tauri), signs the updater files with the update key, and attaches everything plus
# latest.json (read by the in-app updaters, including kimchi 0.1.x's Tauri updater) to a DRAFT
# GitHub release, which stays private. The builds are not published here any more (lsuite
# DISTRIBUTION.md): `scripts/publish-build.sh <version>` copies the draft's files to the private
# ludovic111/lsuite-builds as kimchi-v<version>, where the lsuite app and the in-app updater get
# them through lsuite.xyz with the person's account, then deletes the draft. Never publish the draft.
#
# Asset names are stable (no version) so the lsuite app and the updaters always find them:
# kimchi_aarch64.dmg, kimchi_x64.dmg, kimchi_{aarch64,x64}.app.tar.gz, kimchi_x64-setup.exe,
# kimchi_x64-portable.zip, kimchi_amd64.AppImage, kimchi_amd64.deb. latest.json's URLs point at
# GitHub; lsuite.xyz rewrites them to its own file route.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' && secrets.APPLE_API_KEY_P8_BASE64 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux only while lsuite is in beta (decided 2026-10-08): macOS and Windows are coming soon.
          # Put these lines back to build them again; everything after the build handles any platforms.
          # - { name: macOS (Apple Silicon), os: macos-latest, target: aarch64-apple-darwin, script: bundle-macos.sh }
          # - { name: macOS (Intel), os: macos-latest, target: x86_64-apple-darwin, script: bundle-macos.sh }
          # - { name: Windows, os: windows-latest, target: x86_64-pc-windows-msvc, script: bundle-windows.sh }
          - { name: Linux, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, script: bundle-linux.sh }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the workspace version $version in Cargo.toml." >&2
            exit 1
          fi

      # GPUI's Linux backends (X11 + Wayland, Vulkan, fontconfig) and the keychain (D-Bus);
      # see script/linux in the zed repository.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libasound2-dev libdbus-1-dev libfontconfig-dev libfreetype-dev \
            libssl-dev libvulkan-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libzstd-dev libglib2.0-dev desktop-file-utils

      - name: NSIS (Windows)
        if: runner.os == 'Windows'
        run: |
          if ! command -v makensis > /dev/null && [ ! -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            choco install nsis -y --no-progress
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Read access to the private ryolune engine
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.RYOLUNE_DEPLOY_KEY }}
      - name: Fetch ryolune over SSH
        shell: bash
        run: |
          git config --global url."ssh://git@github.com/ludovic111/ryolune".insteadOf "https://github.com/ludovic111/ryolune"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Update key present
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "The TAURI_SIGNING_PRIVATE_KEY secret is not set: installed apps would refuse this release's updates." >&2
            exit 1
          fi

      # Developer ID signing and notarization on macOS, with the same secrets as ryolune
      # (APPLE_CERTIFICATE_P12_BASE64, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      # APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER). Without them the build is
      # ad-hoc signed.
      - name: Apple signing and notarization (macOS)
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/prepare-apple-signing.sh

      - name: Build and package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/${{ matrix.script }} ${{ runner.os == 'macOS' && matrix.target || '' }}

      - name: Remove signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/signing.keychain-db"; fi
          rm -f "$RUNNER_TEMP/notary.p8"

      - uses: actions/upload-artifact@v4
        with:
          name: kimchi-${{ matrix.target }}
          path: |
            target/dist/kimchi_*.dmg
            target/dist/kimchi_*.app.tar.gz
            target/dist/kimchi_*.app.tar.gz.sig
            target/dist/kimchi_*-setup.exe
            target/dist/kimchi_*-setup.exe.sig
            target/dist/kimchi_*-portable.zip
            target/dist/kimchi_*-portable.zip.sig
            target/dist/kimchi_*.AppImage
            target/dist/kimchi_*.AppImage.sig
            target/dist/kimchi_*.deb
            target/dist/kimchi_*.deb.sig
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Read access to the private ryolune engine
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.RYOLUNE_DEPLOY_KEY }}
      - name: Fetch ryolune over SSH
        shell: bash
        run: |
          git config --global url."ssh://git@github.com/ludovic111/ryolune".insteadOf "https://github.com/ludovic111/ryolune"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-tool
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: latest.json and checksums
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # What changed (CHANGELOG.md's section for this version) first: the in-app updater shows
          # these notes for the update it offers.
          awk -v v="$version" '/^## /{p = ($2 == v); next} p' CHANGELOG.md | sed -e '/./,$!d' > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat >> "$RUNNER_TEMP/notes.md" <<'EOF'

          ### Get it
          Get kimchi in the lsuite app (lsuite.xyz/launcher), with no account. kimchi
          updates itself from there on.
          EOF
          # Checks every signature against kimchi's update key before writing the manifest.
          cargo run --quiet --release --locked -p kimchi-release -- manifest dist --version "$version" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v$version" \
            --notes-file "$RUNNER_TEMP/notes.md" --out dist/latest.json
          cat dist/latest.json
          (cd dist && sha256sum kimchi_* latest.json > SHA256SUMS)
          ls -l dist

      # A draft only: scripts/publish-build.sh moves it to ludovic111/lsuite-builds.
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isDraft -q .isDraft)" != true ]; then
              echo "Release $tag is already published; not replacing its files." >&2
              exit 1
            fi
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --draft --target "$GITHUB_SHA" --title "kimchi $tag" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
