name: Suite release build

on:
  workflow_dispatch:
    inputs:
      app:
        description: App to build with the suite signing credentials (lsuite is the launcher, in launcher/ of ludovic111/lsuite)
        type: choice
        options: [nori, folio, lsuite]
        required: true
      ref:
        description: Full commit SHA in that app's repository
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.app }} · ${{ matrix.target }}
    # macOS rows run on the Mac mini (MAC_RUNNER=macos-latest sends them back to GitHub). This
    # workflow only runs by hand (workflow_dispatch), never for a fork's pull request.
    runs-on: ${{ matrix.mac && (vars.MAC_RUNNER || 'ludovics-mac-mini') || matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux and macOS (both Mac targets on the Mac mini, Intel cross-compiled). Windows is coming
          # soon: put its line back to build it again; the steps for it are kept below.
          - { mac: true, target: aarch64-apple-darwin, script: bundle-macos.sh }
          - { mac: true, target: x86_64-apple-darwin, script: bundle-macos.sh }
          # - { os: windows-latest, target: x86_64-pc-windows-msvc, script: bundle-windows.sh }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, script: bundle-linux.sh }
    defaults:
      run:
        shell: bash
        # The launcher lives in launcher/ of the lsuite repository; the apps at their root.
        working-directory: ${{ inputs.app == 'lsuite' && 'launcher' || '.' }}
    steps:
      - name: Validate source
        working-directory: .
        env:
          APP: ${{ inputs.app }}
          REF: ${{ inputs.ref }}
        run: |
          [[ "$APP" == nori || "$APP" == folio || "$APP" == lsuite ]]
          [[ "$REF" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          repository: ludovic111/${{ inputs.app }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
          # On the Mac mini, keep target/ between runs (incremental builds).
          clean: ${{ runner.environment == 'github-hosted' }}
      - name: Linux dependencies
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libasound2-dev libdbus-1-dev libfontconfig-dev libfreetype-dev libssl-dev libvulkan-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev libglib2.0-dev desktop-file-utils
      - name: Windows installer tools
        if: runner.os == 'Windows'
        working-directory: .
        run: choco install nsis -y --no-progress
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          key: suite-${{ inputs.app }}-${{ matrix.target }}
          workspaces: ${{ inputs.app == 'lsuite' && 'launcher -> target' || '. -> target' }}
      # The Mac mini runs as its owner: save the keychain search list before the app's signing
      # script adds its throwaway keychain, so the cleanup puts it back exactly as it was.
      - name: Save the keychain search list
        if: runner.os == 'macOS'
        working-directory: .
        run: security list-keychains -d user | sed -e 's/^ *"//' -e 's/"$//' > "$RUNNER_TEMP/keychains-before"
      - name: Prepare Apple signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/prepare-apple-signing.sh
      - name: Build and package
        env:
          TARGET: ${{ matrix.target }}
          SCRIPT: ${{ matrix.script }}
        # target/dist may hold an earlier job's files on the Mac mini (target/ is kept): start clean.
        run: |
          rm -rf target/dist
          bash "scripts/$SCRIPT" "$TARGET"
      - name: Sign updater archives
        env:
          APP: ${{ inputs.app }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.app == 'nori' && secrets.NORI_UPDATE_SIGNING_KEY || inputs.app == 'lsuite' && secrets.LSUITE_UPDATE_SIGNING_KEY || secrets.FOLIO_UPDATE_SIGNING_KEY }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          cargo build --release --locked -p "$APP-release"
          for file in target/dist/*.app.tar.gz target/dist/*.exe target/dist/*.zip target/dist/*.AppImage target/dist/*.deb target/dist/*.tar.gz; do
            [ -f "$file" ] || continue
            "target/release/$APP-release" sign "$file" --version "$version"
            "target/release/$APP-release" verify "$file" --version "$version"
          done
      - name: Remove signing keychain
        if: always() && runner.os == 'macOS'
        working-directory: .
        run: |
          if [ -f "$RUNNER_TEMP/keychains-before" ]; then
            keychains=()
            while IFS= read -r k; do [ -n "$k" ] && keychains+=("$k"); done < "$RUNNER_TEMP/keychains-before"
            security list-keychains -d user -s ${keychains[@]+"${keychains[@]}"}
          fi
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/signing.keychain-db"; fi
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/keychains-before"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-${{ matrix.target }}
          path: |
            ${{ inputs.app == 'lsuite' && 'launcher/' || '' }}target/dist/*.dmg
            ${{ inputs.app == 'lsuite' && 'launcher/' || '' }}target/dist/*.app.tar.gz
            ${{ inputs.app == 'lsuite' && 'launcher/' || '' }}target/dist/*.exe
            ${{ inputs.app == 'lsuite' && 'launcher/' || '' }}target/dist/*.zip
            ${{ inputs.app == 'lsuite' && 'launcher/' || '' }}target/dist/*.AppImage
            ${{ inputs.app == 'lsuite' && 'launcher/' || '' }}target/dist/*.deb
            ${{ inputs.app == 'lsuite' && 'launcher/' || '' }}target/dist/*.tar.gz
            ${{ inputs.app == 'lsuite' && 'launcher/' || '' }}target/dist/*.sig
          if-no-files-found: error
