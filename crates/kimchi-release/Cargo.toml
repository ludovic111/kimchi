[package]
name = "kimchi-release"
description = "Release tooling: signs update archives with the Tauri-format minisign key and writes latest.json (no Node needed)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "kimchi-release"
path = "src/main.rs"

[dependencies]
base64.workspace = true
minisign.workspace = true
minisign-verify.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
