[package]
name = "kimchi-agent"
description = "kimchi's built-in agent: runs the person's model (Claude Code, Codex, API keys, local) over the command registry"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kimchi-control.workspace = true
kimchi-core.workspace = true

chrono.workspace = true
futures.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
# Amazon Bedrock without the AWS SDK: SigV4 request signing (HMAC-SHA256) and the CRC32 of
# its event stream framing. Pure Rust, and already in the build through other crates.
crc32fast = "1"
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
