[package]
name = "kimchi-mcp"
description = "kimchi as a Model Context Protocol server (stdio): every registry command is a tool"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kimchi-mcp"
path = "src/main.rs"

[dependencies]
kimchi-audio.workspace = true
kimchi-cli.workspace = true
kimchi-control.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }

[dev-dependencies]
tempfile.workspace = true
