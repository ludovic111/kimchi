[package]
name = "kimchi-control"
description = "kimchi's command registry: one named, validated set of commands shared by the window, the agent, the CLI and MCP"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kimchi-audio.workspace = true
kimchi-core.workspace = true
kimchi-gen.workspace = true
kimchi-media.workspace = true
kimchi-captions.workspace = true

base64.workspace = true
chrono.workspace = true
dirs.workspace = true
flate2.workspace = true
futures.workspace = true
minisign-verify.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tar.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

# ryolune's engine, for its stock effects' factory presets (the same pin as kimchi-audio's).
ryolune-engine = { git = "https://github.com/ludovic111/ryolune", rev = "50751d8" }

keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[dev-dependencies]
minisign.workspace = true
tempfile.workspace = true
wiremock.workspace = true
