[package]
name = "kimchi-media"
description = "ffmpeg-backed probing and export for kimchi, and its compositor: text, motion graphics and 3D"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cosmic-text.workspace = true
kimchi-audio.workspace = true
kimchi-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tiny-skia.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
# 3D: meshes, models, the CPU rasteriser and the GPU renderer (Metal / Vulkan / DirectX 12).
gltf = { version = "1", default-features = false, features = ["import", "utils", "names"] }
lyon_tessellation = "1"
pollster = "0.4"
rayon = "1"
wgpu = "29"
# Hald CLUT pictures used as LUTs (8 and 16-bit), read in Rust: png is tiny-skia's own decoder,
# tiff a small pure-Rust one.
png = "0.17"
tiff = "0.11"
# Video plugins: kimchi's SDK (its C ABI), the stock plugins built on it (linked in), libloading
# for plugin libraries (lsuite plugins and frei0r), toml for lsuite plugin bundles.
kimchi-plugin = { path = "../kimchi-plugin" }
kimchi-plugin-examples = { path = "../../plugins/examples" }
libloading = "0.8"
toml = "0.8"

[dev-dependencies]
chrono.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
