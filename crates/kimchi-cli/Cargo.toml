[package]
name = "kimchi-cli"
description = "kimchi from the terminal: every registry command, on the running app or on a project file"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "kimchi_cli"
path = "src/lib.rs"

[[bin]]
name = "kimchi-cli"
path = "src/main.rs"

[dependencies]
kimchi-agent.workspace = true
kimchi-audio.workspace = true
kimchi-control.workspace = true
kimchi-gen.workspace = true
kimchi-media.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
kimchi-core.workspace = true
tempfile.workspace = true
